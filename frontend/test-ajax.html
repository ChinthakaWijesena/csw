<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero AJAX Controller Test</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f8f9fa;
        }
        
        .hero-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 0;
        }
        
        .search-card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .form-select.loading {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' width='12' height='12' fill='none' stroke='%23666'%3e%3ccircle cx='6' cy='6' r='4.5'/%3e%3cpath d='m5.8 3.6-.4.4'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 16px 12px;
            opacity: 0.7;
        }
        
        .form-select.is-valid {
            border-color: #198754;
        }
        
        .form-select.is-invalid {
            border-color: #dc3545;
        }
        
        .toast-message {
            animation: slideInRight 0.3s ease-out;
        }
        
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <section class="hero-section">
        <div class="container">
            <div class="row justify-content-center text-center">
                <div class="col-12 col-xl-10 col-lg-11">
                    <h1 class="display-4 fw-bold mb-4">Hero AJAX Controller Test</h1>
                    <p class="lead mb-4">Test the enhanced AJAX functionality for property search</p>
                    
                    <!-- Search Form -->
                    <div class="card shadow-lg">
                        <div class="card-body p-4">
                            <form id="searchForm" class="row g-3">
                                <!-- Province -->
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="province" class="form-label fw-semibold">Province</label>
                                    <select class="form-select" id="province" name="province">
                                        <option value="">Select Province</option>
                                        <option value="1">Western Province</option>
                                        <option value="2">Central Province</option>
                                        <option value="3">Southern Province</option>
                                    </select>
                                </div>

                                <!-- District -->
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="district" class="form-label fw-semibold">District</label>
                                    <select class="form-select" id="district" name="district" disabled>
                                        <option value="">Select District</option>
                                    </select>
                                </div>

                                <!-- City -->
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="city" class="form-label fw-semibold">City</label>
                                    <select class="form-select" id="city" name="city" disabled>
                                        <option value="">Select City</option>
                                    </select>
                                </div>

                                <!-- Property Type -->
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="property_type" class="form-label fw-semibold">Property Type</label>
                                    <select class="form-select" id="property_type" name="property_type">
                                        <option value="">Any Type</option>
                                        <option value="apartment">Apartment</option>
                                        <option value="house">House</option>
                                        <option value="condo">Condo</option>
                                    </select>
                                </div>

                                <!-- Search Button -->
                                <div class="col-12">
                                    <button type="submit" class="btn btn-primary btn-lg w-100">
                                        <i class="fas fa-search me-2"></i>Search Properties
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Test Results Section -->
    <section class="container my-5">
        <div class="row">
            <div class="col-12">
                <div class="test-section">
                    <h3><i class="fas fa-flask me-2"></i>AJAX Test Results</h3>
                    <div id="testResults">
                        <p class="text-muted">Perform a search to see AJAX functionality in action...</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Search Results -->
        <div id="searchResults" style="display: none;">
            <div class="test-section">
                <h3><i class="fas fa-search me-2"></i>Search Results</h3>
                <div id="searchResultsContent"></div>
            </div>
        </div>
    </section>

    <!-- Wishlist Counter -->
    <div class="position-fixed bottom-0 end-0 p-3">
        <div class="bg-primary text-white rounded-circle p-3 shadow">
            <i class="fas fa-heart"></i>
            <span class="badge bg-danger position-absolute top-0 start-100 translate-middle" id="wishlist-count">0</span>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Hero AJAX Controller -->
    <script src="js/hero-ajax.js"></script>
    
    <!-- Test Script -->
    <script>
        // Override API endpoints for testing
        document.addEventListener('DOMContentLoaded', function() {
            if (window.heroAJAX) {
                // Mock API responses for testing
                heroAJAX.apiEndpoints.locations = 'data:text/plain,{"success":true,"districts":[{"id":1,"name":"Colombo"},{"id":2,"name":"Gampaha"}],"cities":[{"id":1,"name":"Colombo City"},{"id":2,"name":"Dehiwala"}]}';
                heroAJAX.apiEndpoints.search = 'data:text/plain,{"success":true,"properties":[{"id":1,"title":"Test Property","description":"This is a test property","property_type":"apartment","bedrooms":2,"bathrooms":1,"area_sqft":1000,"monthly_rent":50000,"city":"Colombo","state":"Western Province","primary_image":"https://via.placeholder.com/400x250"}]}';
                
                console.log('Hero AJAX Controller loaded and ready for testing!');
                
                // Add test results display
                const testResults = document.getElementById('testResults');
                testResults.innerHTML = `
                    <div class="alert alert-success">
                        <h5><i class="fas fa-check-circle me-2"></i>AJAX Controller Loaded Successfully!</h5>
                        <p class="mb-0">The Hero AJAX Controller is ready. Try the following features:</p>
                        <ul class="mt-2">
                            <li><strong>Location Cascading:</strong> Select a province to load districts</li>
                            <li><strong>Form Validation:</strong> Real-time validation feedback</li>
                            <li><strong>Search History:</strong> Removed</li>
                            <li><strong>Keyboard Shortcuts:</strong> Ctrl+Enter to search, Escape to clear</li>
                            <li><strong>Wishlist:</strong> Add properties to wishlist</li>
                            <li><strong>Toast Messages:</strong> Success/error notifications</li>
                        </ul>
                    </div>
                `;
            }
        });
        
        // Add some test functionality
        function runAJAXTests() {
            console.log('Running AJAX tests...');
            
            // Test 1: Location cascading
            console.log('Test 1: Testing location cascading...');
            
            // Test 2: Form validation
            console.log('Test 2: Testing form validation...');
            
            // Test 3: Search functionality
            console.log('Test 3: Testing search functionality...');
            
            // Test 4: Wishlist functionality
            console.log('Test 4: Testing wishlist functionality...');
            
            console.log('All AJAX tests completed!');
        }
        
        // Run tests after a delay
        setTimeout(runAJAXTests, 2000);
    </script>
</body>
</html>
